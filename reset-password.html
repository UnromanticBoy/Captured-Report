<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
        }

        .reset-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
        }

        .description {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .success {
            background: #e8f7ed;
            color: #176b35;
        }

        .error {
            background: #fdecec;
            color: #a32121;
        }

        .back {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }

        #loadingMessage {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        #resetForm {
            display: none;
        }
    </style>
</head>

<body>

<div class="reset-box">

    <h2>Reset Password</h2>

    <p class="description">
        Enter your new password below.
    </p>

    <div id="loadingMessage">
        Verifying your password reset link...
    </div>

    <form id="resetForm">

        <label for="newPassword">
            New Password
        </label>

        <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            required
            minlength="6"
        >

        <label for="confirmPassword">
            Confirm New Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Re-enter new password"
            required
            minlength="6"
        >

        <button type="submit" id="resetButton">
            Update Password
        </button>

    </form>

    <div id="message" class="message"></div>

    <a
        class="back"
        href="report.html"
    >
        Back to Login
    </a>

</div>


<script>

    // =========================================================
    // SUPABASE CONFIGURATION
    // =========================================================

    const SUPABASE_URL =
        "https://zgowfgfuaglpmoigfktx.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_fz31GlOgQRS9nhiCjN0XnA_0g4K7H_S";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // =========================================================
    // ELEMENTS
    // =========================================================

    const loadingMessage =
        document.getElementById("loadingMessage");

    const resetForm =
        document.getElementById("resetForm");

    const resetButton =
        document.getElementById("resetButton");

    const message =
        document.getElementById("message");

    const newPassword =
        document.getElementById("newPassword");

    const confirmPassword =
        document.getElementById("confirmPassword");


    // =========================================================
    // SHOW MESSAGE
    // =========================================================

    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;

        message.style.display = "block";
    }


    // =========================================================
    // VERIFY RESET SESSION
    // =========================================================

    async function verifyResetSession() {

        try {

            /*
             * Supabase password-reset links can contain
             * authentication information in the URL.
             *
             * Supabase JS will process the recovery session.
             */

            const {
                data: {
                    session
                },
                error
            } =
                await supabaseClient.auth.getSession();


            if (error) {

                console.error(error);

                loadingMessage.style.display = "none";

                showMessage(
                    "Unable to verify the password reset link.",
                    "error"
                );

                return;
            }


            if (!session) {

                loadingMessage.style.display = "none";

                showMessage(
                    "This password reset link is invalid or has expired. Please request a new reset email.",
                    "error"
                );

                return;
            }


            // Get the logged-in/recovery user's details

            const {
                data: {
                    user
                },
                error: userError
            } =
                await supabaseClient.auth.getUser();


            if (userError || !user) {

                loadingMessage.style.display = "none";

                showMessage(
                    "Unable to verify your account.",
                    "error"
                );

                return;
            }


            // =================================================
            // CHECK WHETHER EMAIL IS STILL ALLOWED
            // =================================================

            const {
                data: allowed,
                error: allowedError
            } =
                await supabaseClient.rpc(
                    "is_report_email_allowed",
                    {
                        p_email: user.email
                    }
                );


            if (allowedError || !allowed) {

                console.error(
                    "Access check failed:",
                    allowedError
                );

                await supabaseClient.auth.signOut();

                loadingMessage.style.display = "none";

                showMessage(
                    "This email does not currently have active report access.",
                    "error"
                );

                return;
            }


            // =================================================
            // EVERYTHING IS OK
            // =================================================

            loadingMessage.style.display = "none";

            resetForm.style.display = "block";

        }

        catch (error) {

            console.error(error);

            loadingMessage.style.display = "none";

            showMessage(
                "Unable to verify the password reset link.",
                "error"
            );
        }
    }


    // =========================================================
    // UPDATE PASSWORD
    // =========================================================

    resetForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const password =
                newPassword.value;

            const confirm =
                confirmPassword.value;


            // Check password length

            if (password.length < 6) {

                showMessage(
                    "Password must contain at least 6 characters.",
                    "error"
                );

                return;
            }


            // Check matching passwords

            if (password !== confirm) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;
            }


            resetButton.disabled = true;

            resetButton.textContent =
                "Updating Password...";


            try {

                const {
                    error
                } =
                    await supabaseClient.auth.updateUser({
                        password: password
                    });


                if (error) {

                    console.error(error);

                    showMessage(
                        error.message,
                        "error"
                    );

                    resetButton.disabled = false;

                    resetButton.textContent =
                        "Update Password";

                    return;
                }


                // Password successfully changed

                showMessage(
                    "Password updated successfully. Redirecting to login...",
                    "success"
                );


                newPassword.value = "";
                confirmPassword.value = "";


                // Sign out the recovery session

                await supabaseClient.auth.signOut();


                setTimeout(
                    function() {

                        window.location.href =
                            "report.html";

                    },
                    2000
                );

            }

            catch (error) {

                console.error(error);

                showMessage(
                    "Unable to update the password.",
                    "error"
                );

                resetButton.disabled = false;

                resetButton.textContent =
                    "Update Password";
            }

        }
    );


    // =========================================================
    // START
    // =========================================================

    verifyResetSession();

</script>

</body>
</html>
